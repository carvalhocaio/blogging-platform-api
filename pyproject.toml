[project]
name = "blogging-platform-api"
version = "0.1.0"
description = "RESTful blogging platform API for Clancy's letters from Dema"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
blog-seed = "blogging_platform_api.infrastructure.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blogging_platform_api"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.27",
    "pip-audit>=2.10.0",
    "pre-commit>=4.0.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
